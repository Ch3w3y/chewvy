name: pages

# Publishes site/ to GitHub Pages.
#
# This file is a proposal. It does nothing until it is copied to
# .github/workflows/pages.yml: see site/DEPLOY.md.
#
# It is started by hand, so that the site changes only when a maintainer says
# the release it describes is published. It runs on a GitHub-hosted runner and
# has no pull_request trigger.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the site's links
        run: python3 site/tools/check-links.py
      - name: Refuse to publish a site that still marks features as unreleased
        run: |
          if grep -q 'data-release="pending"' site/index.html; then
            echo "site/index.html still says data-release=\"pending\"; see site/DEPLOY.md" >&2
            exit 1
          fi
      - name: Collect the files to publish
        run: |
          mkdir _site
          cp -r site/index.html site/credits.html site/styles.css site/main.js site/assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
